<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="25" y="20" width="150" height="160" rx="15" ry="15" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- PDF document icon -->
  <rect x="45" y="40" width="110" height="140" rx="5" ry="5" fill="white" stroke="#d0d0d0" stroke-width="2"/>
  
  <!-- Red PDF corner fold -->
  <path d="M155,40 L155,60 L135,40 Z" fill="#e74c3c"/>
  
  <!-- "PDF" text -->
  <text x="77" y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#e74c3c">PDF</text>
  
  <!-- Edit pencil -->
  <g transform="translate(105, 120) rotate(-45)">
    <!-- Pencil body -->
    <rect x="-5" y="-30" width="10" height="45" rx="2" ry="2" fill="#3498db"/>
    <!-- Pencil tip -->
    <polygon points="-5,-30 5,-30 0,-40" fill="#f1c40f"/>
    <!-- Eraser -->
    <rect x="-5" y="15" width="10" height="8" rx="1" ry="1" fill="#e74c3c"/>
  </g>
  
  <!-- Edit lines -->
  <line x1="65" y1="115" x2="135" y2="115" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="130" x2="95" y2="130" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="145" x2="120" y2="145" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
</svg>